<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title description">
<title id="title">FY21 planning priorities</title><desc id="description">Planning targets: generate at least 266 leads monthly; reach 100 percent of newly enlisted Recruit Sustainment Program members monthly; support 103 retention interviews monthly. These are planned activities, not achieved results.</desc>
<rect x="0" y="0" width="1200" height="980" rx="0" fill="#f5f0e5"/><rect x="0" y="0" width="1200" height="200" rx="0" fill="#27271c"/><text x="56" y="48" font-family="DejaVu Sans" font-size="21" font-weight="600" fill="#d7c297">FY21 STRATEGY / PLANNING TARGETS</text><text x="56" y="111" font-family="DejaVu Serif" font-size="43" font-weight="400" fill="#f5f0e5">Three priorities. One staffing goal.</text><text x="56" y="163" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#f5f0e5">Connect recruiting, training preparation, and continued service.</text><rect x="56" y="238" width="8" height="162" rx="0" fill="#626044"/><text x="88" y="273" font-family="DejaVu Serif" font-size="35" font-weight="400" fill="#27271c">Recruit</text><text x="88" y="311" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#565647">Prospective members</text><text x="88" y="357" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#27271c">Connect local opportunities to education,</text><text x="88" y="393" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#27271c">career experience, and community service.</text><rect x="805" y="238" width="339" height="162" rx="3" fill="#626044"/><text x="832" y="311" font-family="DejaVu Serif" font-size="54" font-weight="400" fill="#f5f0e5">266</text><text x="832" y="357" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#f5f0e5">leads per month</text><path d="M56 423H1144" stroke="#d0cbb8" stroke-width="2"/><rect x="56" y="444" width="8" height="162" rx="0" fill="#48472c"/><text x="88" y="479" font-family="DejaVu Serif" font-size="35" font-weight="400" fill="#27271c">Prepare</text><text x="88" y="517" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#565647">Newly enlisted members</text><text x="88" y="563" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#27271c">Keep recruits informed and connected</text><text x="88" y="599" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#27271c">while they wait to attend training.</text><rect x="805" y="444" width="339" height="162" rx="3" fill="#48472c"/><text x="832" y="517" font-family="DejaVu Serif" font-size="54" font-weight="400" fill="#f5f0e5">100%</text><text x="832" y="563" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#f5f0e5">monthly audience reach</text><path d="M56 629H1144" stroke="#d0cbb8" stroke-width="2"/><rect x="56" y="650" width="8" height="162" rx="0" fill="#383822"/><text x="88" y="685" font-family="DejaVu Serif" font-size="35" font-weight="400" fill="#27271c">Retain</text><text x="88" y="723" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#565647">Current members</text><text x="88" y="769" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#27271c">Explain continued-service benefits</text><text x="88" y="805" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#27271c">and support retention conversations.</text><rect x="805" y="650" width="339" height="162" rx="3" fill="#383822"/><text x="832" y="723" font-family="DejaVu Serif" font-size="54" font-weight="400" fill="#f5f0e5">103</text><text x="832" y="769" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#f5f0e5">retention interviews / month</text><path d="M56 875H1144" stroke="#d0cbb8" stroke-width="2"/><text x="56" y="905" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#565647">Adapted from the FY21 marketing plan, prepared August 2020; pp. 3, 8–10.</text><text x="56" y="937" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#565647">Targets describe the plan. They are not reported campaign results.</text></svg>