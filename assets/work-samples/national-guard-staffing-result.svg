<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title description">
<title id="title">FY19 staffing goal and actual result</title><desc id="description">A zero-based bar chart of FY19 overall staffing: 9,300 goal and 9,391 actual, or 91 members above the goal. This is an organization-wide end-strength result, not the number of new enlistments or a result attributed solely to marketing.</desc>
<rect x="0" y="0" width="1200" height="980" rx="0" fill="#f5f0e5"/><rect x="0" y="0" width="1200" height="200" rx="0" fill="#27271c"/><text x="56" y="48" font-family="DejaVu Sans" font-size="21" font-weight="600" fill="#d7c297">DOCUMENTED RESULT / FY19</text><text x="56" y="111" font-family="DejaVu Serif" font-size="43" font-weight="400" fill="#f5f0e5">Overall staffing exceeded the goal.</text><text x="56" y="163" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#f5f0e5">The FY21 plan records a completed-year staffing result.</text><text x="56" y="298" font-family="DejaVu Serif" font-size="88" font-weight="400" fill="#27271c">9,391</text><text x="405" y="278" font-family="DejaVu Sans" font-size="30" font-weight="400" fill="#27271c">members at year end</text><text x="405" y="324" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#565647">91 above the annual goal</text><text x="56" y="404" font-family="DejaVu Sans" font-size="20" font-weight="600" fill="#565647">MEMBERS / ZERO-BASED SCALE</text><text x="56" y="442" font-family="DejaVu Sans" font-size="27" font-weight="600" fill="#27271c">FY19 goal</text><text x="968" y="442" font-family="DejaVu Serif" font-size="31" font-weight="400" fill="#27271c">9,300</text><rect x="56" y="466" width="1088" height="66" rx="2" fill="#e4dfd0"/><rect x="56" y="466" width="1011.84" height="66" rx="2" fill="#959477"/><text x="56" y="596" font-family="DejaVu Sans" font-size="27" font-weight="600" fill="#27271c">FY19 actual</text><text x="968" y="596" font-family="DejaVu Serif" font-size="31" font-weight="400" fill="#27271c">9,391</text><rect x="56" y="620" width="1088" height="66" rx="2" fill="#e4dfd0"/><rect x="56" y="620" width="1021.741" height="66" rx="2" fill="#383822"/><path d="M56 735H1144" stroke="#565647" stroke-width="2"/><path d="M56.0 735v9" stroke="#565647" stroke-width="2"/><text x="56.0" y="777" text-anchor="start" font-family="DejaVu Sans" font-size="22" fill="#565647">0</text><path d="M328.0 735v9" stroke="#565647" stroke-width="2"/><text x="328.0" y="777" text-anchor="middle" font-family="DejaVu Sans" font-size="22" fill="#565647">2,500</text><path d="M600.0 735v9" stroke="#565647" stroke-width="2"/><text x="600.0" y="777" text-anchor="middle" font-family="DejaVu Sans" font-size="22" fill="#565647">5,000</text><path d="M872.0 735v9" stroke="#565647" stroke-width="2"/><text x="872.0" y="777" text-anchor="middle" font-family="DejaVu Sans" font-size="22" fill="#565647">7,500</text><path d="M1144.0 735v9" stroke="#565647" stroke-width="2"/><text x="1144.0" y="777" text-anchor="end" font-family="DejaVu Sans" font-size="22" fill="#565647">10,000</text><text x="56" y="843" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#27271c">Overall staffing is “end strength”; it is distinct from new enlistments.</text><path d="M56 875H1144" stroke="#d0cbb8" stroke-width="2"/><text x="56" y="905" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#565647">Adapted from the FY21 marketing plan, prepared August 2020; p. 7.</text><text x="56" y="937" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#565647">Organization-wide result. Marketing contributed alongside recruiting and retention teams.</text></svg>