<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title description">
<title id="title">Audience insight and channel roles</title><desc id="description">In the 2020 account analysis, more than half of active monthly Facebook users were age 55 or older. The core new-recruit audience was 17 to 24. The plan used Facebook to reach influential adults and prioritized Instagram for paid recruiting.</desc>
<rect x="0" y="0" width="1200" height="980" rx="0" fill="#f5f0e5"/><rect x="0" y="0" width="1200" height="200" rx="0" fill="#27271c"/><text x="56" y="48" font-family="DejaVu Sans" font-size="21" font-weight="600" fill="#d7c297">AUDIENCE INSIGHT / CHANNEL DECISION</text><text x="56" y="111" font-family="DejaVu Serif" font-size="43" font-weight="400" fill="#f5f0e5">Give each channel a clear job.</text><text x="56" y="163" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#f5f0e5">Use the audience you have to reach the people who matter.</text><text x="56" y="268" font-family="DejaVu Sans" font-size="21" font-weight="600" fill="#565647">THE ACCOUNT INSIGHT</text><text x="56" y="335" font-family="DejaVu Serif" font-size="51" font-weight="400" fill="#27271c">More than half</text><text x="56" y="381" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#27271c">of the recruiting Facebook page’s active monthly users were 55+.</text><text x="56" y="424" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#27271c">The core new-recruit audience in the plan was 17–24.</text><path d="M56 464H1144" stroke="#d0cbb8" stroke-width="2"/><rect x="56" y="500" width="8" height="144" rx="0" fill="#48472c"/><text x="88" y="535" font-family="DejaVu Serif" font-size="34" font-weight="400" fill="#27271c">Facebook</text><text x="88" y="579" font-family="DejaVu Sans" font-size="27" font-weight="600" fill="#27271c">Reach people who influence the decision.</text><text x="88" y="617" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#565647">Inform family members and other trusted voices</text><text x="88" y="652" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#565647">about the benefits and culture of service.</text><rect x="56" y="688" width="8" height="144" rx="0" fill="#48472c"/><text x="88" y="723" font-family="DejaVu Serif" font-size="34" font-weight="400" fill="#27271c">Instagram</text><text x="88" y="767" font-family="DejaVu Sans" font-size="27" font-weight="600" fill="#27271c">Prioritize paid recruiting investment.</text><text x="88" y="805" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#565647">The plan favored a closer audience fit and access</text><text x="88" y="840" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#565647">to real-time promotion data under existing contracts.</text><path d="M56 875H1144" stroke="#d0cbb8" stroke-width="2"/><text x="56" y="905" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#565647">Adapted from the FY21 marketing plan, prepared August 2020; p. 15.</text><text x="56" y="937" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#565647">Historical audience insight and planned channel roles, not current platform demographics.</text></svg>